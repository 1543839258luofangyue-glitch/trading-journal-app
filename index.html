<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>交易日志</title>
<style>
/* 版式：手机优先的单列工作台，底部固定五个分区；红=禁止，绿=放行，琥珀=待办/冷静 */
:root{
  --bg:#EBEEF1; --paper:#F8F9FA; --ink:#131B22; --muted:#5B6873; --line:#CBD2D8; --soft:#DDE3E8;
  --stop:#BE3329; --stop-soft:rgba(190,51,41,.11); --go:#14775F; --go-soft:rgba(20,119,95,.12);
  --wait:#B97A0C; --wait-soft:rgba(217,154,30,.16); --steel:#24435C; --steel-soft:rgba(36,67,92,.09);
  --display:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif; --body:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --paper:#141C23; --ink:#E3E8EC; --muted:#93A0AA; --line:#2B3640; --soft:#1E2831;
  --stop:#E5604F; --stop-soft:rgba(229,96,79,.15); --go:#3EBD97; --go-soft:rgba(62,189,151,.14);
  --wait:#E7B44B; --wait-soft:rgba(231,180,75,.14); --steel:#8DB2D0; --steel-soft:rgba(141,178,208,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1318; --paper:#141C23; --ink:#E3E8EC; --muted:#93A0AA; --line:#2B3640; --soft:#1E2831;
  --stop:#E5604F; --stop-soft:rgba(229,96,79,.15); --go:#3EBD97; --go-soft:rgba(62,189,151,.14);
  --wait:#E7B44B; --wait-soft:rgba(231,180,75,.14); --steel:#8DB2D0; --steel-soft:rgba(141,178,208,.10); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.3;margin:0}
h1{font-size:26px;font-weight:900} h2{font-size:21px;font-weight:900} h3{font-size:17px;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .stop{color:var(--stop)} .go{color:var(--go)} .wait{color:var(--wait)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:18px 10px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--go-soft);color:var(--go)} .pill.warn{background:var(--wait-soft);color:var(--wait)} .pill.bad{background:var(--stop);color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--paper);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
nav.tabs .row{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{font:inherit;font-size:12.5px;border:0;background:none;color:var(--muted);padding:6px 2px;border-radius:10px;display:grid;justify-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--soft);font-weight:700}

.badge{font-size:10.5px;background:var(--wait);color:var(--paper);border-radius:999px;padding:0 6px;line-height:1.6;margin-left:2px}
main{display:grid;gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0}
.card.warn{border-color:var(--wait)} .card.bad{border-color:var(--stop)} .card.good{border-color:var(--go)}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big button{font:inherit;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:14px;cursor:pointer;display:grid;gap:4px;min-height:96px;align-content:start}
.big button b{font-family:var(--display);font-size:18px}
.big button span{font-size:13px;color:var(--muted);line-height:1.5}
.big button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.big button.primary span{color:var(--paper);opacity:.8}
.big button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats div{background:var(--paper);padding:8px 10px;display:grid;font-size:11.5px;color:var(--muted);min-width:0}
.stats b{font-family:var(--mono);font-size:14.5px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list{display:grid;gap:0}
.item{font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;cursor:pointer;width:100%}
.item:last-child{border-bottom:0}
.item .no{font-family:var(--mono);font-size:12px;color:var(--muted);width:38px}
.item .t{display:grid;min-width:0}
.item .t span{font-size:12.5px;color:var(--muted)}
.item .v{font-family:var(--mono);text-align:right}
.item:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.chip{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--stop-soft);color:var(--stop)} .chip.grn{background:var(--go-soft);color:var(--go)} .chip.amb{background:var(--wait-soft);color:var(--wait)} .chip.blu{background:var(--steel-soft);color:var(--steel)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:inherit;font-size:15px;font-weight:700;padding:11px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.red{background:var(--stop);color:#fff}
.btn.go{background:var(--go);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.full .btn{flex:1}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.f.wide{grid-column:1/-1}
.f input,.f select,.f textarea{font:inherit;font-size:15.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.f .aifill{border-color:var(--wait);background:var(--wait-soft)}
.f textarea{min-height:64px;resize:vertical}
.f input:focus-visible,.f select:focus-visible,.f textarea:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button.y[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:#fff}
.seg button.n[aria-pressed="true"]{background:var(--stop);border-color:var(--stop);color:#fff}
.seg button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.yn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.yn:last-child{border-bottom:0}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;display:grid;gap:6px;cursor:pointer;background:var(--paper)}
.drop.over{border-color:var(--steel);background:var(--steel-soft)}
.drop b{font-family:var(--display);font-size:18px}
.drop:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumb{display:grid;gap:4px;font-size:12px;min-width:0}
.thumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--soft);max-width:100%}
.thumb select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:3px 6px;min-width:0}
.thumb button{font:inherit;font-size:12px;background:none;border:0;color:var(--stop);cursor:pointer;text-align:left;padding:0}
.light{border-radius:14px;padding:16px;display:grid;gap:8px;border:2px solid var(--line);background:var(--paper)}
.light.block{border-color:var(--stop);background:var(--stop-soft)} .light.pass{border-color:var(--go);background:var(--go-soft)} .light.cool{border-color:var(--wait);background:var(--wait-soft)}
.light .sig{display:flex;align-items:center;gap:10px}
.light .sig i{width:28px;height:28px;border-radius:50%;flex:none;background:var(--muted)}
.light.block .sig i{background:var(--stop)} .light.pass .sig i{background:var(--go)} .light.cool .sig i{background:var(--wait)}
.light .sig b{font-family:var(--display);font-size:20px}
.light ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.stopmsg{border-radius:12px;background:var(--stop);color:#fff;padding:12px 14px;font-size:15px;line-height:1.6}
.panic{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.panic button{font:inherit;font-size:13.5px;text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--stop);background:var(--stop-soft);color:var(--stop);cursor:pointer;font-weight:500}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--soft)}
.steps i.on{background:var(--steel)}
.grid3{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px;font-size:13px}
.grid3 div{padding:10px 8px;border-radius:10px;background:var(--soft);min-width:0;line-height:1.4}
.grid3 .h{background:none;font-weight:700;font-size:12px;color:var(--muted);padding:4px}
.grid3 .on{outline:3px solid var(--ink);font-weight:700}
.grid3 .gw,.grid3 .gb{background:var(--go-soft)} .grid3 .gl{background:var(--steel-soft)} .grid3 .bw{background:var(--wait-soft)} .grid3 .bb,.grid3 .bl{background:var(--stop-soft)}
.cmp{display:grid;gap:4px;margin-bottom:12px}
.cmp-h,.cmp-r{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
.cmp-h{font-size:12px;color:var(--muted);font-weight:700}
.cbar{position:relative;height:18px;background:var(--soft);border-radius:4px;overflow:hidden}
.cbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}.cbar i.g{background:var(--go)}.cbar i.b{background:var(--stop);opacity:.75}
.cbar em{position:absolute;right:4px;top:0;font-style:normal;font-family:var(--mono);font-size:11px;line-height:18px;color:var(--ink)}
.wfs{display:grid;gap:0}.wf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}.wf button.chip{border:0;cursor:pointer;font:inherit;font-size:11.5px}
.promise{border-left:4px solid var(--steel);padding:6px 12px;background:var(--steel-soft);border-radius:0 10px 10px 0;font-size:14px}
.promise ol{margin:4px 0 0;padding-left:20px}
.metric{display:grid;grid-template-columns:minmax(0,1.3fr) 70px 70px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.metric:last-child{border-bottom:0}
.metric .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft);position:relative;overflow:hidden}
.metric .bar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px}
.metric .bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
.metric .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.metric.head{font-size:12px;color:var(--muted);padding-top:0}
.ai{white-space:pre-wrap;font-size:14.5px;line-height:1.75;background:var(--steel-soft);border-radius:12px;padding:12px 14px}
.guide{display:grid;gap:10px}
.guide .lvl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start}
.guide .lvl b{font-family:var(--mono);font-size:13px;background:var(--soft);border-radius:8px;padding:6px;text-align:center}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.shots img{width:100%;border-radius:10px;border:1px solid var(--line);max-width:100%}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.empty{display:grid;gap:6px;justify-items:start;padding:6px 0}
textarea.copy{width:100%;min-height:160px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px}
.weekbars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:120px}
.weekbars div{display:grid;gap:3px;justify-items:center;font-size:10.5px;color:var(--muted);height:100%;align-content:end}
.weekbars i{width:100%;border-radius:4px 4px 0 0;background:var(--go);min-height:2px}
a{color:var(--steel)}
h4{font-size:14px;margin:4px 0 0;font-weight:700}
.evform{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.evs{display:grid;gap:0;border-top:1px solid var(--line)}
.feelbox{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);margin:6px 0 12px}
.feelbox h4{margin:0}
.ev.feel b{color:var(--steel)}
.ev{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.okmsg{border-radius:12px;background:var(--go-soft);color:var(--go);padding:10px 14px;font-size:14.5px}
.pillbtn{border:0;font:inherit;cursor:pointer}
.noimg{min-height:60px}
.mdview{font-size:14px;line-height:1.7;overflow-x:auto}
.mdview h3{font-size:17px;margin:14px 0 6px}.mdview h4{font-size:15px;margin:12px 0 4px}
.mdview table{border-collapse:collapse;font-size:12.5px;margin:6px 0;min-width:100%}
.mdview td,.mdview th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.mdview ul{margin:4px 0;padding-left:20px}
.steplist{margin:0;padding-left:22px;display:grid;gap:6px;font-size:14.5px}
.paste{width:100%;min-height:110px;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px}
</style>

<body>
<div class="app">
  <header class="top"><h1>交易日志</h1><button type="button" class="pill pillbtn" id="storePill" data-act="tab" data-v="setup">正在读取</button></header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="分区"><div class="row" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ================= 基础 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=3600e3,MIN=60e3,DAY=24*H;
const now=()=>Date.now();
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(/[,，\s]/g,''));return isFinite(n)?n:null};
const bj=ms=>{const d=new Date(ms+8*H);const p=x=>String(x).padStart(2,'0');return{h:d.getUTCHours(),day:`${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`,str:`${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`,date:d}};
function weekKey(ms){const d=new Date(ms+8*H);const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const fy=t.getUTCFullYear();const f4=new Date(Date.UTC(fy,0,4));const w=1+Math.round(((t-f4)/DAY-3+((f4.getUTCDay()+6)%7))/7);return `${fy}-W${String(w).padStart(2,'0')}`}
function fmtMoney(v,d=2){if(v==null||!isFinite(v))return '—';const s=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});return (v<0?'−':v>0?'+':'')+s}
const pctS=v=>v==null?'—':(v>0&&v<0.1?(v*100).toFixed(1):Math.round(v*100))+'%';
/* 时间输入一律按北京时间解释，和交易所 App 显示一致 */
const toInput=ms=>{if(ms==null)return '';const d=new Date(ms+8*H);const p=x=>String(x).padStart(2,'0');return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}T${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`};
function fromInput(s){s=String(s||'').trim();let m=s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m)return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))-8*H;
  m=s.match(/^(\d{1,2})[-/.月](\d{1,2})日?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m){const y=new Date(now()+8*H).getUTCFullYear();let v=Date.UTC(y,+m[1]-1,+m[2],+m[3],+m[4],+(m[5]||0))-8*H;if(v>now()+DAY)v=Date.UTC(y-1,+m[1]-1,+m[2],+m[3],+m[4],+(m[5]||0))-8*H;return v}
  return null}
/* 净盈亏：用户说明“盈亏里没扣手续费”时才减去手续费 */
const netPnl=t=>{const c=t&&t.close;if(!c||c.pnl==null)return null;return c.feeIncl==='no'&&c.fee!=null?c.pnl-Math.abs(c.fee):c.pnl};
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ================= 规则与基线 ================= */

const IDB={db:null,mem:new Map()};
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('trading-journal',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB.db=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}})}
function idbReq(mode,fn){return new Promise(res=>{if(!IDB.db){res(fn(null));return}try{const tx=IDB.db.transaction('kv',mode);const st=tx.objectStore('kv');const r=fn(st);if(r&&'onsuccess' in r){r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)}else{tx.oncomplete=()=>res(r);tx.onerror=()=>res(undefined)}}catch(e){res(undefined)}})}
const idbGet=k=>IDB.db?idbReq('readonly',st=>st.get(k)):Promise.resolve(IDB.mem.get(k));
const idbSet=(k,v)=>IDB.db?idbReq('readwrite',st=>st.put(v,k)):Promise.resolve(IDB.mem.set(k,v));
const idbDel=k=>IDB.db?idbReq('readwrite',st=>st.delete(k)):Promise.resolve(IDB.mem.delete(k));
function idbEntries(prefix){if(!IDB.db)return Promise.resolve([...IDB.mem.entries()].filter(([k])=>k.startsWith(prefix)));
  return new Promise(res=>{const out=[];try{const tx=IDB.db.transaction('kv','readonly');const c=tx.objectStore('kv').openCursor(IDBKeyRange.bound(prefix,prefix+'￿'));c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}else res(out)};c.onerror=()=>res(out)}catch(e){res(out)}})}

/* ---------- 保存：先存本机，再排队上传 ---------- */
async function putDoc(path,data){const c=(await idbGet('doc:'+path))||{};c.data=clone(data);await idbSet('doc:'+path,c);enqueue({op:'json',path})}
function saveP(){return putDoc(PATH.P,APP.P)}
function saveT(t){t.updatedAt=now();return putDoc(PATH.T(t.id),t)}
function delT(t){APP.T=APP.T.filter(x=>x.id!==t.id);idbDel('doc:'+PATH.T(t.id));enqueue({op:'del',path:PATH.T(t.id)});(t.shots||[]).forEach(s=>{if(s.p){idbDel('img:'+s.p);enqueue({op:'del',path:s.p})}})}
function saveW(k){APP.W[k].k=k;APP.W[k].updatedAt=now();return putDoc(PATH.W(k),APP.W[k])}
function saveF(f){return putDoc(PATH.F(f.id),f)}
function enqueue(op){const q=SYNC.q;if(op.op==='json'&&q.some(o=>o.op==='json'&&o.path===op.path))return;
  if(op.op==='del'){SYNC.q=q.filter(o=>o.path!==op.path)}SYNC.q.push(Object.assign({ts:now()},op));idbSet('queue',SYNC.q);updatePill();clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,800)}

/* ---------- GitHub ---------- */
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const repoPath=()=>`/repos/${encodeURIComponent(CFG.owner)}/${encodeURIComponent(CFG.repo)}`;
const contentsURL=p=>`${repoPath()}/contents/${enc(p)}`;
async function gh(method,path,body,accept,cfg){const c=cfg||CFG;let r;
  try{r=await fetch(c.api+path,{method,cache:'no-store',headers:Object.assign({Authorization:'Bearer '+c.token,Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined})}
  catch(e){const er=new Error('net');er.kind='net';throw er}
  return r}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}const er=new Error(m||('HTTP '+r.status));er.status=r.status;
  er.kind=r.status===401?'auth':r.status===403&&/rate limit/i.test(m)?'rate':r.status===403?'perm':r.status===404?'notfound':'http';return er}
function b64bytes(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const b64json=o=>b64bytes(new TextEncoder().encode(JSON.stringify(o,null,1)+'\n'));
const b64blob=async b=>b64bytes(new Uint8Array(await b.arrayBuffer()));
const unb64json=s=>{const bin=atob(String(s).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))};
function msgFor(path,data){const rel=path.slice(REC.length+1);
  if(rel==='profile.json')return '日志：更新状态';if(rel.startsWith('trades/'))return `日志：记录 #${(data&&data.no)||''}`.trim();
  if(rel.startsWith('weeks/'))return '日志：周复盘 '+rel.slice(6,-5);if(rel.startsWith('screenshots/'))return '日志：截图';if(rel.startsWith('exports/'))return '日志：交易所导出';return '日志：'+rel}
async function getRemoteJSON(path){const r=await gh('GET',contentsURL(path)+'?ref='+encodeURIComponent(CFG.branch));if(r.status===404)return null;if(!r.ok)throw await ghErr(r);const j=await r.json();return {sha:j.sha,data:unb64json(j.content||'')}}
function mergeProfile(remote,local){const m=Object.assign({},remote,local);const uniq=(a,key)=>{const s=new Map();a.forEach(x=>s.set(key(x),x));return [...s.values()]};
  m.violations=uniq([...(remote.violations||[]),...(local.violations||[])],v=>v.t+'|'+v.rule+'|'+v.trade).sort((a,b)=>a.t-b.t).slice(-300);
  m.deposits=uniq([...(remote.deposits||[]),...(local.deposits||[])],d=>d.t).sort((a,b)=>a.t-b.t).slice(-100);
  ['seq','paperPlans','lastLossAt','lastBigWinAt','externalSeenAt','weekStopUntil','depositLockUntil'].forEach(k=>m[k]=Math.max(remote[k]||0,local[k]||0));
  if(remote.lastClose&&(!local.lastClose||remote.lastClose.t>local.lastClose.t))m.lastClose=remote.lastClose;return m}
function mergeDoc(path,remote,local){if(path===PATH.P)return mergeProfile(remote||{},local||{});return (remote&&(remote.updatedAt||0)>(local.updatedAt||0))?remote:local}
async function pushJSON(path,c){const body={message:msgFor(path,c.data),content:b64json(c.data),branch:CFG.branch};if(c.sha)body.sha=c.sha;
  let r=await gh('PUT',contentsURL(path),body);
  if(r.status===409||r.status===422){/* 另一台设备改过，或文件已存在：取回来合并后再存 */
    const remote=await getRemoteJSON(path);if(remote){c.data=mergeDoc(path,remote.data,c.data);body.sha=remote.sha;body.content=b64json(c.data)}else delete body.sha;
    r=await gh('PUT',contentsURL(path),body);APP.needReload=true}
  if(!r.ok)throw await ghErr(r);const j=await r.json();c.sha=j.content&&j.content.sha;await idbSet('doc:'+path,c)}
async function doOp(op){
  if(op.op==='json'){const c=await idbGet('doc:'+op.path);if(c&&c.data)await pushJSON(op.path,c);return}
  if(op.op==='blob'){const b=(await idbGet('img:'+op.path))||(await idbGet('file:'+op.path));if(!b)return;
    const r=await gh('PUT',contentsURL(op.path),{message:msgFor(op.path),content:await b64blob(b),branch:CFG.branch});if(r.status===422)return;if(!r.ok)throw await ghErr(r);return}
  if(op.op==='del'){let sha=null;const r0=await gh('GET',contentsURL(op.path)+'?ref='+encodeURIComponent(CFG.branch));if(r0.status===404)return;if(!r0.ok)throw await ghErr(r0);sha=(await r0.json()).sha;
    const r=await gh('DELETE',contentsURL(op.path),{message:'日志：删除记录',sha,branch:CFG.branch});if(r.status===404)return;if(!r.ok)throw await ghErr(r)}}
async function ensureBranch(){if(CFG.branch)return;const r=await gh('GET',repoPath());if(!r.ok)throw await ghErr(r);CFG.branch=(await r.json()).default_branch||'main';lsSet('tj_gh',CFG)}
async function flush(){if(SYNC.busy||!cfgOk()||!SYNC.q.length){updatePill();return}SYNC.busy=true;updatePill();
  try{await ensureBranch();while(SYNC.q.length){const op=SYNC.q[0];await doOp(op);SYNC.q=SYNC.q.filter(o=>o!==op);await idbSet('queue',SYNC.q);updatePill()}
    SYNC.err=null;SYNC.last=now();lsSet('tj_last_sync',SYNC.last)}
  catch(e){SYNC.err=e}
  SYNC.busy=false;updatePill();if(APP.needReload){APP.needReload=false;await loadFromCache();render()}}
/* 从 GitHub 取回别的设备记下的内容 */
async function pull(){if(!cfgOk())return false;let changed=false;
  try{await ensureBranch();const r1=await gh('GET',`${repoPath()}/git/trees/${encodeURIComponent(CFG.branch)}`);if(r1.status===409||r1.status===404)return false;if(!r1.ok)throw await ghErr(r1);
    const rec=((await r1.json()).tree||[]).find(x=>x.path===REC&&x.type==='tree');const remote={};
    if(rec){const r2=await gh('GET',`${repoPath()}/git/trees/${rec.sha}?recursive=1`);if(!r2.ok)throw await ghErr(r2);
      ((await r2.json()).tree||[]).forEach(x=>{if(x.type==='blob'&&/^(profile\.json|(trades|weeks|files)\/[^/]+\.json)$/.test(x.path))remote[REC+'/'+x.path]=x.sha})}
    const pend=new Set(SYNC.q.map(o=>o.path));
    for(const [path,sha] of Object.entries(remote)){if(pend.has(path))continue;const c=await idbGet('doc:'+path);if(c&&c.sha===sha)continue;
      const r=await gh('GET',`${repoPath()}/git/blobs/${sha}`);if(!r.ok)throw await ghErr(r);await idbSet('doc:'+path,{sha,data:unb64json((await r.json()).content)});changed=true}
    for(const [k,c] of await idbEntries('doc:'+REC+'/')){const path=k.slice(4);if(!remote[path]&&!pend.has(path)&&c&&c.sha){await idbDel(k);changed=true}}
    SYNC.err=null;SYNC.last=now();lsSet('tj_last_sync',SYNC.last)}
  catch(e){SYNC.err=e}
  if(changed)await loadFromCache();updatePill();return changed}
async function loadFromCache(){const T=[],W={},F=[];let P=null;
  for(const [k,v] of await idbEntries('doc:'+REC+'/')){if(!v||!v.data)continue;const p=k.slice(4);
    if(p===PATH.P)P=v.data;else if(p.startsWith(REC+'/trades/'))T.push(v.data);else if(p.startsWith(REC+'/weeks/'))W[v.data.k||p.split('/').pop().replace(/\.json$/,'')]=v.data;else if(p.startsWith(REC+'/files/'))F.push(v.data)}
  APP.P=Object.assign(freshProfile(),P||{});APP.T=T.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));APP.W=W;APP.F=F.sort((a,b)=>(b.t||0)-(a.t||0))}
const nextNo=()=>Math.max(APP.P.seq||0,...APP.T.map(t=>t.no||0))+1;

/* ---------- 截图与文件 ---------- */
const IMGURL={};
async function getBlob(p){let b=(await idbGet('img:'+p))||(await idbGet('file:'+p));
  if(!b&&cfgOk()){try{await ensureBranch();const r=await gh('GET',contentsURL(p)+'?ref='+encodeURIComponent(CFG.branch),null,'application/vnd.github.raw');if(r.ok){b=await r.blob();await idbSet((/\.csv$/i.test(p)?'file:':'img:')+p,b)}}catch(e){}}
  return b||null}
async function imgURL(p){if(IMGURL[p])return IMGURL[p];const b=await getBlob(p);if(!b)return null;return IMGURL[p]=URL.createObjectURL(b)}
function hydrate(){document.querySelectorAll('img[data-img]:not([src])').forEach(async el=>{const u=await imgURL(el.dataset.img);if(u)el.src=u;else{el.alt='截图还没取到';el.classList.add('noimg')}})}
function saveFile(name,data,type){const blob=data instanceof Blob?data:new Blob([data],{type:type||'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},5000)}

/* ---------- 状态标签 ---------- */
function updatePill(){const pill=$('#storePill');if(!pill)return;const n=SYNC.q.length;let t,c;
  if(APP.mode==='loading'){t='正在读取';c='pill'}
  else if(!cfgOk()){t='没连 GitHub：只存在这台设备';c='pill bad'}
  else if(SYNC.busy){t=n?`正在上传 ${n} 项`:'正在同步';c='pill warn'}
  else if(SYNC.err){const k=SYNC.err.kind;t=k==='net'?`没网，${n} 项待上传`:k==='auth'?'钥匙失效，点这里重新连接':k==='perm'?'钥匙没有写入权限':k==='notfound'?'找不到仓库，点这里检查':`上传出错，${n} 项待上传`;c='pill bad'}
  else if(n){t=`${n} 项待上传`;c='pill warn'}
  else{t='已存到 GitHub';c='pill ok'}
  pill.textContent=t;pill.className=c}
const errText=e=>!e?'':e.kind==='net'?'连不上 GitHub。检查网络（手机需要能打开 github.com），连上后会自动补传。':e.kind==='auth'?'钥匙不对或已过期，请重新建一把钥匙并粘贴。':e.kind==='perm'?'钥匙没有写入权限：建钥匙时 Contents 要选 Read and write。':e.kind==='notfound'?'找不到这个仓库，或者钥匙没有勾选这个仓库。':e.kind==='rate'?'GitHub 暂时限流，过几分钟会自动重试。':('出错了：'+(e.message||'未知'));

/* ================= 日内与阶段 ================= */
function rollDay(){const d=bj(now()).day;const P=APP.P;if(P.day!==d){P.day=d;P.dayTrades=0;P.dayLossPct=0;P.dayConsec=0;P.dayStopped=false}}
const recentViol=()=>APP.P.violations.filter(v=>now()-v.t<7*DAY);
function addViolation(rule,tradeId,red){const P=APP.P,t=now();if(tradeId&&P.violations.some(v=>v.trade===tradeId&&v.rule===rule))return false;P.violations.push({t,rule,trade:tradeId||null});P.violations=P.violations.slice(-300);P.dayStopped=true;P.stageCount=0;
  if(red&&P.stage>1)P.stage--;
  if(recentViol().length>=2&&P.weekStopUntil<t)P.weekStopUntil=t+7*DAY;return true}
function canAdvance(){const P=APP.P;if(P.stage===0)return now()-P.stageStart>=14*DAY&&P.paperPlans>=10;if(P.stage===1||P.stage===2)return P.stageCount>=30;return false}
const openTrade=()=>APP.T.find(t=>t.id===APP.P.openId&&t.status==='open')||APP.T.find(t=>t.status==='open')||null;
const openTrades=()=>APP.T.filter(t=>t.status==='open').sort((a,b)=>((b.open&&b.open.t)||b.createdAt)-((a.open&&a.open.t)||a.createdAt));
const realTrades=()=>APP.T.filter(t=>t.status!=='paper');

/* ================= 闸门判断 ================= */
function gateEval(form){
  rollDay();const P=APP.P,t=now(),h=bj(t).h,g=APP.gate;const block=[],cool=[],warn=[];const left=u=>Math.ceil((u-t)/MIN);
  STATE_QS.forEach(q=>{const a=g.ans[q[0]];if(a!==true)block.push(a==null?`没确认：${q[1]}`:`状态不对（${q[1]}）：只能平仓`)});
  if(h<8)block.push('00:00–08:00 不开新仓');
  if(h>=19&&h<23&&!form.preplan)block.push('19:00–23:00 只执行 18:00 前写好的计划');
  if(g.isPlan!==true)block.push(g.isPlan==null?'没回答：依据是不是自己提前写好的结构计划':'依据不是自己提前写好的计划，不开');
  if(!g.trigs.length&&!g.none)block.push('没回答：此刻有没有那些情况');
  g.trigs.filter(k=>k!=='ext').forEach(k=>block.push('此刻：'+trigText(k)+' —— 这不能当开单理由'));
  if(P.externalSeenAt&&t-P.externalSeenAt<30*MIN)cool.push(`看了直播、群消息、新闻后 30 分钟内不下单，还剩 ${left(P.externalSeenAt+30*MIN)} 分钟`);
  if(g.ifLose==='add')block.push('打算浮亏时加仓摊成本：这就是“被动重仓”，不开');
  else if(g.ifLose==='later')cool.push('先想好：浮亏时什么都不做、让止损执行。想好了再选一次');
  else if(g.ifLose==null)block.push('没回答：如果开仓后浮亏，你打算怎么办');
  if(g.bePol==null)block.push('没回答：浮盈后什么时候把止损挪到成本');
  else if(g.bePol==='immediate')warn.push('一浮盈就挪保本：过去 35 笔在成本附近被止损打掉，合计只赚 1,378。建议赚到计划亏损的 1 倍再挪');
  if(g.levOk===false)block.push('先去交易所把杠杆调到 3 倍以下、改成逐仓');else if(g.levOk==null)block.push('没回答：交易所杠杆是不是 3 倍以下、逐仓');
  if(P.stage===0)block.push('第 0 阶段：不下真单，只写计划');
  if(openTrade())block.push('已经有一个持仓，同时只持一个');
  if(P.weekStopUntil>t)block.push('本周停止交易，至 '+bj(P.weekStopUntil).str);
  if(P.dayStopped)block.push('今天已经停了，明天 08:00 后再说');
  if(P.dayTrades>=3)block.push('今天已经 3 笔');
  if(P.depositLockUntil>t)cool.push(`入金后 24 小时不交易，还剩 ${left(P.depositLockUntil)} 分钟`);
  if(P.lastLossAt&&t-P.lastLossAt<60*MIN)cool.push(`亏损后冷静期，还剩 ${left(P.lastLossAt+60*MIN)} 分钟`);
  if(P.lastBigWinAt&&t-P.lastBigWinAt<30*MIN)cool.push(`大赚后冷静期，还剩 ${left(P.lastBigWinAt+30*MIN)} 分钟`);
  const lc=P.lastClose;if(lc&&lc.t&&t-lc.t<60*MIN&&lc.side&&lc.side!==form.side&&(lc.sym===form.symbol||form.symbol==='BTCUSDT'&&lc.sym==='BTCUSDT'))cool.push(`刚平完就反手（过去 18 次这样），还剩 ${left(lc.t+60*MIN)} 分钟`);
  if(form.symbol!=='BTCUSDT')block.push('只做 BTCUSDT');
  if(/kol|直播|群|胡总|比特肥|老师|带单|喊单|kk\s*说/i.test(form.note||''))block.push('补充说明里不能写任何人的观点（KOL、群、带单、KK 说）');
  if(!form.invalid)block.push('没写“到什么情况说明我看错了”');
  let size=null;const e=form.entry,st=form.stop,tg=form.target,eq=form.equity;
  if(!(e>0&&st>0&&tg>0&&eq>0))block.push('入场、止损、目标、账户 u 数都要填数字');
  else{
    if(form.side==='LONG'&&!(st<e&&tg>e))block.push('做多：止损要低于入场，目标要高于入场');
    if(form.side==='SHORT'&&!(st>e&&tg<e))block.push('做空：止损要高于入场，目标要低于入场');
    const r=RISK[P.stage]||0.0025,dist=Math.abs(e-st),qtyRisk=eq*r/dist,qtyLev=3*eq/e,qty=Math.min(qtyRisk,qtyLev),capped=qtyLev<qtyRisk;
    const notional=qty*e,lev=notional/eq,riskAmt=qty*dist,rr=Math.abs(tg-e)/dist;
    size={r,dist,qty,qtyRisk,capped,notional,lev,riskAmt,riskPct:riskAmt/eq,rr};
    if(capped)warn.push(`按 ${(r*100).toFixed(2)}% 风险能开 ${qtyRisk.toFixed(3)}，超过本金 3 倍上限，只能开 ${qty.toFixed(3)}。不要为了多开去把止损挪远`);
    if(form.intended>0){size.intendRatio=form.intended/qty;if(size.intendRatio>1.05)warn.push(`你本来想开 ${form.intended}，是允许数量的 ${size.intendRatio.toFixed(1)} 倍。按允许的开`)}
  }
  const kk=kkEval(g.k,form.side,size?size.rr:null);block.push(...kk.block);warn.push(...kk.warn);
  if(!(g.shots||[]).length)warn.push('没放下单前的 K 线截图：以后复盘、给 AI 看时，就看不到当时的图');
  return {block,cool,warn,size,kk};
}

/* ================= 指标 ================= */
function overnight(t){if(!t.open||!t.close)return false;let a=t.open.t,b=t.close.t;let d=new Date(a+8*H);d=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-8*H;for(;d<=b;d+=DAY){if(a<d+7*H&&b>d)return true}return false}

function mdToHtml(md){const L=String(md||'').split('\n');let h='',inUl=false,tbl=null;const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const closeAll=()=>{if(inUl){h+='</ul>';inUl=false}if(tbl){h+='<table>'+tbl.map((r,i)=>'<tr>'+r.map(c=>i===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>';tbl=null}};
  L.forEach(l=>{const t=l.trim();
    if(/^\|.*\|$/.test(t)){if(inUl){h+='</ul>';inUl=false}if(/^\|[\s:|-]+\|$/.test(t))return;tbl=tbl||[];tbl.push(t.slice(1,-1).split('|').map(c=>c.trim()));return}
    if(tbl){h+='<table>'+tbl.map((r,i)=>'<tr>'+r.map(c=>i===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>';tbl=null}
    if(/^#{1,2} /.test(t)){closeAll();h+=`<h3>${inl(t.replace(/^#+ /,''))}</h3>`}else if(/^#{3,} /.test(t)){closeAll();h+=`<h4>${inl(t.replace(/^#+ /,''))}</h4>`}
    else if(/^- /.test(t)){if(!inUl){h+='<ul>';inUl=true}h+=`<li>${inl(t.slice(2))}</li>`}
    else if(t){closeAll();h+=`<p>${inl(t)}</p>`}else closeAll()});
  closeAll();return h}

const EXPORT_README=()=>`# 交易日志导出包

导出时间：${new Date().toISOString()}（北京时间 ${bj(now()).day} ${bj(now()).str.slice(6)}）

这是一位加密货币永续合约交易者的逐笔交易日志，给任何 AI 或人阅读、监督用。完整资料（以前 136 笔的分析、规则、全部记录）在他的 GitHub 私有仓库里，这个压缩包是一份离线备份。背景：2021 年起长期亏损；2026-05-27 至 07-01 的 136 笔交易所记录（基线）显示主要问题是重仓、浮亏加仓、止损太远或往外挪、持仓中转钱、亏损后马上再开。

## 文件
- \`复盘记录.md\`：人能直接读的逐笔复盘。
- \`data/trades.json\` / \`data/trades.jsonl\`：逐笔原始数据（每行一笔），附 \`computed\`（净盈亏、R、是否跨凌晨、持仓分钟、是否全部守规则等）。
- \`data/profile.json\`：阶段、违规记录 violations、当前权益等状态。
- \`data/weeks.json\`：周复盘回答。
- \`data/metrics.json\`：全部 / 最近 30 天 / 按周的守规则比例和结果，和 136 笔基线 baseline136 对比。
- \`data/exchange_exports.json\` + \`exports/\`：用户上传的交易所导出（CSV），用于对账。
- \`screenshots/T编号/\`：交易所仓位截图和 K 线图。

## 关键字段
- 时间都是毫秒时间戳（UTC）；\`computed.openBJ\` / \`closeBJ\` 是北京时间。
- \`status\`：open 持仓中 / closed 待复盘 / reviewed 已复盘 / paper 纸面计划（不是真单）。
- \`plan.gate\`：pass 做了下单前检查且绿灯 / skipped 没做检查直接下单 / paper 只写计划没下单。
- \`plan.kk\`：结构依据（KK 清单）的点选结果。dir 日线方向 UP/DOWN/RANGE；tf 形态画在哪个级别 1d/12h/4h/low；pat 形态 range 水平区间 / rtri 直角三角 / stri 对称三角 / flag 旗形 / mw M顶W底 / hs 头肩 / hard 难形态 / none 看不出；touch 碰了几次 2/3/4/5（5 = 5 次以上）；pts、flat、norev、wickOk、noNews 是否满足（true = 满足）；fail 这条线以前失败几次 0/1/2；conf 突破确认 4h/12h/1d/intra（还没收线）/no（还没突破）；vol up/flat/low；stopAt candle（突破那根 K 线外）/other；tgtBy measure/pole/other；ok 是否全部合格，fails 不合格的原因。\`plan.rr\`：目标倍数（目标距离 ÷ 止损距离）。\`plan.note\`：补充说明。截图 kind 为 preDay / preTf 的是下单前的 K 线图。
- \`plan.isPlan\`：依据是不是自己提前写好的结构计划；\`plan.triggers\`：开仓那一刻的情况（多选）：missed 刚错过/刚被打掉、regret 想回本、revisit 价格回到上一单位置、ext 刚看了直播群新闻、askGroup 刚去群里问、bored 无聊、toy 小仓玩一下或晒单、number 想让账户回到某个数。旧记录只有单选 \`plan.trigger\`。
- \`plan.ifLosing\`（浮亏时打算：letStop/add/later）、\`plan.bePolicy\`（after1R/immediate）、\`plan.intendedQty\` 与 \`plan.intendRatio\`（本来想开的数量 ÷ 允许数量，衡量重仓冲动）。
- \`urges\`：持仓中点“我想……”按钮的记录（忍住的冲动）。
- \`feels\`：持仓中随时记下的感受：t 时间、emo 情绪（calm 平静、confident 有把握、nervous 紧张、fear 害怕、hope 侥幸希望它回来、regret 后悔、anxious 着急、greedy 贪心、excited 兴奋、angry 烦躁、revenge 想回本、bored 无聊、numb 麻木）、pnl 当时浮盈 profit / 成本附近 be / 浮亏 loss、doing 当时在做什么（watch 盯盘、lowtf 看 1 小时以下的图、ext 看直播或群、video 刷视频、out 吃饭外出、work 上班、drink 喝了酒、bed 准备睡觉、night 半夜醒着）、price、text 自己写或说的话。和 events、urges 按时间放在一起看，能看出哪种情绪之后出现了什么动作。
- \`review\`：realTriggers 事后看真实原因；exitWhy 为什么这时候平；smoves 止损怎么动过；beReached 挪保本时浮盈是否到 1R；stopHit 价格到过止损但没走（yesStay）；floatMax 最多浮亏几倍计划亏损；floatActs 浮亏时怎么做；holdOther 持仓中的其他情况；afterClose 平仓后做了什么。
- \`classification\`：按用户原复盘表口径自动推出的 出场方式 / 止损类型 / 扛单类型 / 交易类型（rule_version manual136-v1），可直接和 136 笔基线比。
- \`recon\`（如有）：用交易所导出对账后写入的结果，优先于自报。
- \`plan.stop0\` 开仓时止损，\`plan.stop\` 最后的止损；\`open.price0\`/\`qty0\` 首仓，\`open.price\`/\`qty\` 加减仓后的均价和数量。
- \`events\`：持仓中当场记下的动作（add 加仓 / reduce 减仓 / stop 改止损，dir=tighten 收紧、widen 往外挪 / cancelStop 撤止损 / transfer 转钱入金），\`flag\` 是页面自动判定的违规。
- \`checks\`（true = 做过）：addLoss 浮亏加仓、addEarly 浮盈不到 1R 加仓、moveStop 止损放宽过（任何放宽）、stopBeyond 挪到第一张止损外面（与基线口径一致）、cancelStop 撤止损、transfer 持仓转钱、second 同时两个仓、badState 状态不对时交易、stopHeld 到了止损没走、feeHold 因手续费到了止损没走、feeLimit 因手续费到了出场位还挂限价等、extChanged 持仓中被直播群影响改单、levSetting 杠杆超 3 倍或全仓、beEarly 不到 1R 挪保本。
- \`close.pnl\` 照抄交易所的盈亏；\`close.fee\` 手续费；\`close.feeIncl\` = yes 盈亏已扣费 / no 没扣 / unk 不清楚。
- \`review.grade\`：Gwin 正确盈利 / Gloss 正确亏损 / Gbe 正确保本 / Bwin 错误盈利 / Bloss 错误亏损 / Bbe 错误保本（G=守规则，B=犯了错）。

## 监督时请看
1. 守规则比例有没有比基线好：开仓即带止损 32%、无浮亏加仓 73%、止损没外挪 85%、单笔风险≤1% 只有 1.5%、仓位≤3 倍 18%、只做 BTC 59%、不带仓过夜 57%、亏损后 60 分钟内不再开 81%、全部合格 0%；盈亏比 0.11。
2. 有没有重复旧模式：浮亏加仓、止损往外挪或撤掉、持仓中转钱、亏损后马上再开、大赚后马上再开、看了直播群消息开单、半夜或喝酒后交易。
3. 自报数据可能漏记，有交易所导出时请逐笔对账。
4. 只评价过程和纪律，不预测行情，不给买卖建议。

  addShots:b=>{const t=APP.T.find(x=>x.id===b.dataset.id);APP.draft=blankDraft(t);APP.draft.mode=t.status==='open'?'open':'note';APP.detail=null;APP.route='capture';render()},
  mode:b=>{APP.draft.mode=b.dataset.v;render()},
  pick:()=>{const i=$('#fileIn');if(i)i.click()},
  rmShot:b=>{APP.draft.shots.splice(+b.dataset.i,1);render()},
  copyRec:()=>{const d=APP.draft;if(!d||!d.shots.length){toast('先放截图');return}APP.recOpen=true;copyText(recPrompt(d.shots.length),'已复制，去 AI 那里粘贴')},
  applyRec:()=>{const d=APP.draft;if(!d)return;try{applyRecognition(parseAIJSON(APP.paste.rec));APP.paste.rec='';APP.recOpen=false;APP.copyFallback=null;toast('已填好，请核对黄色的格子')}catch(e){toast('没读懂这段回复：请把 AI 回复的整段内容原样粘贴进来')}render()},
  dset:b=>{const k=b.dataset.k,v=b.dataset.v;APP.draft.f[k]=(k==='stopAtOpen'||k==='isPlan')?v==='1':v;render()},
  dtrig:b=>{const f=APP.draft.f,v=b.dataset.v;if(v==='none'){f.none=!f.none;if(f.none)f.trigs=[]}else{f.none=false;const i=f.trigs.indexOf(v);if(i>=0)f.trigs.splice(i,1);else f.trigs.push(v)}render()},
  saveDraft:()=>saveDraft(),
  cancelDraft:()=>{APP.draft=blankDraft();render()},
  ans:b=>{APP.gate.ans[b.dataset.k]=b.dataset.v==='1';APP.gate.res=null;render()},
  gset:b=>{APP.gate[b.dataset.k]=b.dataset.v==='1';APP.gate.res=null;render()},
  gpick:b=>{APP.gate[b.dataset.k]=b.dataset.v;APP.gate.res=null;render()},
  kpick:b=>{const k=APP.gate.k=APP.gate.k||{};k[b.dataset.k]=k[b.dataset.k]===b.dataset.v?null:b.dataset.v;APP.gate.res=null;render()},
  kset:b=>{const k=APP.gate.k=APP.gate.k||{};k[b.dataset.k]=b.dataset.v==='1';APP.gate.res=null;render()},
  gpickImg:()=>{const i=$('#gfileIn');if(i)i.click()},
  grmShot:b=>{APP.gate.shots.splice(+b.dataset.i,1);APP.gate.res=null;render()},
  gtrig:b=>{const g=APP.gate,v=b.dataset.v;if(v==='none'){g.none=!g.none;if(g.none)g.trigs=[]}else{g.none=false;const i=g.trigs.indexOf(v);if(i>=0)g.trigs.splice(i,1);else g.trigs.push(v)}g.res=null;render()},
  gateCheck:()=>{const P=APP.P;if(APP.gate.trigs.includes('ext')&&!(P.externalSeenAt&&now()-P.externalSeenAt<30*MIN)){P.externalSeenAt=now();saveP()}APP.gate.res=gateEval(gateValues());render();setTimeout(()=>{const l=document.querySelector('.light');if(l)l.scrollIntoView({behavior:'smooth',block:'center'})},30)},
  gateOpen:async()=>{if(APP.busy)return;const r=gateEval(gateValues());APP.gate.res=r;if(r.block.length||r.cool.length){render();return}const v=gateValues(),P=APP.P;const q=num(gateForm().filled);if(!(q>0)){toast('请填实际成交了多少');return}APP.busy=true;const tid=newId();let shots=[];try{shots=await uploadShots({shots:APP.gate.shots||[]},tid)}finally{APP.busy=false}P.seq=nextNo();noteEquity(v.equity);if(q>r.size.qty*1.05)toast(`比允许的 ${r.size.qty.toFixed(3)} 多开了，复盘时这一项算没做到`);
    const t={id:tid,no:P.seq,v:2,createdAt:now(),status:'open',symbol:v.symbol,side:v.side,plan:gatePlan(v,r,'pass'),open:{t:now(),price:v.entry,qty:q,price0:v.entry,qty0:q,stopAtOpen:true},shots,checks:{},events:[],urges:[]};
    t.plan.riskAmt=Math.abs(v.entry-v.stop)*q;t.plan.riskPct=t.plan.riskAmt/v.equity;t.plan.lev=q*v.entry/v.equity;
    APP.T.unshift(t);deriveFlags(t);P.openId=t.id;P.dayTrades++;saveT(t);saveP();APP.gate=freshGate();APP.route='today';if(q<=r.size.qty*1.05)toast('已记下开仓。平仓后点“已平仓，记录结果”');render();window.scrollTo(0,0)},
  paper:async()=>{if(APP.busy)return;const v=gateValues(),P=APP.P;const r=gateEval(v);if(!r.size||!v.invalid){toast('计划没写完整：入场、止损、目标、u 数、看错条件都要写');return}if(r.kk&&r.kk.miss.length){toast('第 3 步结构依据（KK 清单）还没选完');return}APP.busy=true;const tid=newId();let shots=[];try{shots=await uploadShots({shots:APP.gate.shots||[]},tid)}finally{APP.busy=false}P.seq=nextNo();P.paperPlans++;noteEquity(v.equity);const t={id:tid,no:P.seq,v:2,createdAt:now(),status:'paper',symbol:v.symbol,side:v.side,plan:Object.assign(gatePlan(v,r,'paper'),{wouldBlock:r.block.slice(0,12),wouldCool:r.cool.slice(0,6)}),shots,checks:{}};APP.T.unshift(t);saveT(t);saveP();APP.gate=freshGate();toast(`已记下计划（第 ${P.paperPlans} 份，没有下单）`);APP.route='today';render()},
  wizFirst:()=>{const p=realTrades().filter(t=>t.status==='closed').sort((a,b)=>a.createdAt-b.createdAt)[0];if(p)startWizard(p)},
  wizStart:b=>{const t=APP.T.find(x=>x.id===b.dataset.id);if(t)startWizard(t)},
  wizNext:()=>{const m=wizMissing(APP.wiz);if(m){toast(m);return}APP.wiz.step=Math.min(5,APP.wiz.step+1);render();window.scrollTo(0,0)},
  wizPrev:()=>{APP.wiz.step=Math.max(0,APP.wiz.step-1);render();window.scrollTo(0,0)},
  wizQuit:()=>{APP.wiz=null;render()},
  wset:b=>{APP.wiz[b.dataset.k]=b.dataset.v==='1';render()},
  wpick1:b=>{APP.wiz.exitWhy=b.dataset.v;render()},wpick2:b=>{APP.wiz.stopHit=b.dataset.v;render()},wpick3:b=>{APP.wiz.floatMax=b.dataset.v;if(b.dataset.v==='0')APP.wiz.floatActs=[];render()},
  wreal:b=>{toggle(APP.wiz.real,b.dataset.v);render()},
  wsm:b=>{const a=APP.wiz.smoves,v=b.dataset.v;if(v==='none'||v==='never'){APP.wiz.smoves=a.includes(v)?[]:[v]}else{APP.wiz.smoves=a.filter(x=>x!=='none'&&x!=='never');toggle(APP.wiz.smoves,v)}render()},
  wfa:b=>{toggle(APP.wiz.floatActs,b.dataset.v);render()},
  who:b=>{exclusiveToggle(APP.wiz,'holdOther',b.dataset.v);render()},
  wac:b=>{exclusiveToggle(APP.wiz,'afterClose',b.dataset.v);render()},
  wcm:b=>{toggle(APP.wiz.commitBroken,b.dataset.v);render()},
  we:b=>{const a=APP.wiz.emo[b.dataset.p];const i=a.indexOf(b.dataset.v);if(i>=0)a.splice(i,1);else a.push(b.dataset.v);render()},
  wl:b=>{APP.wiz.emo.level=+b.dataset.v;render()},
  wn:b=>{const h=lessonHints(APP.T.find(x=>x.id===APP.wiz.id),APP.wiz).find(x=>x[0]===b.dataset.v);APP.wiz.lesson=b.dataset.v;if(h&&!APP.wiz.next)APP.wiz.next=h[1];render()},
  wizDone:()=>wizDone(),
  copyReview:b=>{const t=APP.T.find(x=>x.id===b.dataset.id);if(t)copyText(reviewPrompt(t),'已复制，去 AI 那里粘贴')},
  saveReview:b=>{const t=APP.T.find(x=>x.id===b.dataset.id);const txt=String(APP.paste.review||'').trim();if(!t||!txt){toast('先把 AI 的点评粘贴进来');return}t.review=t.review||{};t.review.ai=txt.slice(0,4000);t.review.aiAt=now();saveT(t);APP.paste.review='';APP.copyFallback=null;toast('点评已保存');render()},
  delAsk:b=>{APP.confirmDel=b.dataset.id;render()},
  delNo:()=>{APP.confirmDel=null;render()},
  delYes:b=>{const t=APP.T.find(x=>x.id===b.dataset.id);if(t){if(APP.P.openId===t.id){APP.P.openId=null;saveP()}delT(t)}APP.confirmDel=null;APP.detail=null;toast('已删除');render()},
  week:b=>{APP.weekKey=b.dataset.v;APP.route='week';render();window.scrollTo(0,0)},
  prevDone:b=>{const k=APP.weekKey||weekKey(now());const w=APP.W[k];if(!w)return;w.answers.prevDone=b.dataset.v;saveW(k);render()},
  weekSave:()=>{const k=APP.weekKey||weekKey(now());APP.W[k].doneAt=now();saveW(k);toast('本周复盘已保存')},
  copyWeek:()=>copyText(weekPrompt(),'已复制，去 AI 那里粘贴'),
  saveWeekAI:()=>{const k=APP.weekKey||weekKey(now());const w=APP.W[k];const txt=String(APP.paste.week||'').trim();if(!w||!txt){toast('先把 AI 的总结粘贴进来');return}w.ai=txt.slice(0,6000);w.aiAt=now();saveW(k);APP.paste.week='';APP.copyFallback=null;toast('本周总结已保存');render()},
  aiDays:b=>{APP.aiDays=+b.dataset.v;render()},
  copySum:()=>{const ta=$('#sumText');const txt=ta.value;try{navigator.clipboard.writeText(txt).then(()=>toast('已复制'),()=>{ta.select();toast('请长按或按 Ctrl+C 复制')})}catch(e){ta.select();toast('请长按或按 Ctrl+C 复制')}},
  exportZip:()=>exportAll(true),
  exportMd:()=>exportAll(false),
  pickExp:()=>{const i=$('#expIn');i.onchange=()=>{if(i.files[0])uploadExport(i.files[0]);i.value=''};i.click()},
  depOpen:()=>{APP.depForm=APP.depForm?null:{};render()},
  depCancel:()=>{APP.depForm=null;render()},
  depSave:()=>{const P=APP.P,t=now(),f=APP.depForm||{};const amt=num(f.amount);if(!(amt>0)){toast('请填入金多少 u');return}const cap=num(f.cap);if(!P.depositCap&&cap>0)P.depositCap=cap;
    const mk=bj(t).day.slice(0,7);if(P.depositMonth!==mk){P.depositMonth=mk;P.depositMonthSum=0}P.depositMonthSum=+(P.depositMonthSum+amt).toFixed(2);P.deposits=(P.deposits||[]).concat([{t,amount:amt,open:!!openTrade()}]).slice(-100);
    const msgs=[];const bad=!!openTrade()||recentViol().length>0;P.depositLockUntil=t+DAY;
    if(bad){addViolation('deposit',null,true);msgs.push(openTrade()?'持仓时入金':'7 天内有违规时入金')}
    if(P.depositCap&&P.depositMonthSum>P.depositCap){addViolation('depositCap',null,false);msgs.push(`本月入金 ${P.depositMonthSum} u，超过你定的 ${P.depositCap} u`)}
    const o=openTrade();if(o){o.checks=o.checks||{};o.checks.transfer=true;(o.events=o.events||[]).push({t,type:'transfer',amount:amt,flag:'transfer'});addViolation('transfer',o.id,true);saveT(o)}
    saveP();APP.depForm=null;toast(msgs.length?'已记下，同时记违规：'+msgs.join('；')+'。24 小时不交易':'已记下入金：24 小时内不交易');render()},
  extSeen:()=>{APP.P.externalSeenAt=now();saveP();toast('记下了：30 分钟内不下单、不改单');render()},
  bedOk:()=>{APP.P.bedAck=bj(now()-8*H).day;saveP();render()},
  cmEditOpen:()=>{APP.cmEdit=[0,1,2].map(i=>((APP.P.commitments||[])[i]||{}).text||'');render()},
  cmCancel:()=>{APP.cmEdit=null;render()},
  cmSave:()=>{const P=APP.P;const old=P.commitments||[];P.commitments=APP.cmEdit.map((x,i)=>{x=String(x||'').trim();if(!x)return null;return old[i]&&old[i].text===x?old[i]:{t:now(),text:x}}).filter(Boolean).slice(0,3);saveP();APP.cmEdit=null;toast('承诺已保存');render()},
  cfgSave:()=>cfgSave(),
  cfgLocal:()=>{lsSet('tj_setup_seen',true);APP.route='today';render()},
  cfgForget:()=>{CFG=Object.assign({},CFG,{token:''});lsSet('tj_gh',CFG);APP.setupMsg={ok:true,text:'已在这台设备上删掉钥匙。记录还在这台设备里，也还在 GitHub 上。'};render()},
  syncNow:async()=>{if(!cfgOk())return;toast('正在同步…');lastPull=now();await pull();await flush();render();toast(SYNC.err?errText(SYNC.err):'同步好了')},
  loadReport:()=>loadReport(),
  copySup:()=>copyText(`请读我的 GitHub 私有仓库 ${CFG.owner}/${CFG.repo}。先看 README.md 和 AI_SUPERVISOR.md，了解我以前的交易和规则；再看 4_进步报告/最新周报.md 和 3_现在的记录/，告诉我最近有没有变好、有没有在重复以前的错误。`),
  selfViol:()=>{addViolation('self',null,false);saveP();toast('主动承认记下了，今天停止。主动承认比隐瞒好得多');render()},
  advance:()=>{if(!canAdvance())return;const P=APP.P;P.stage++;P.stageStart=now();P.stageCount=0;saveP();toast(`进入第 ${P.stage} 阶段`);render()},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b,e)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.d&&APP.draft){APP.draft.f[el.dataset.d]=el.value;if(el.dataset.d==='openAt')APP.draft.f.openAtEdited=true;if(el.dataset.d==='closeAt')APP.draft.f.closeAtEdited=true;delete APP.draft.aiFilled[el.dataset.d];el.classList.remove('aifill')}
  if(el.dataset.ev&&APP.ev){APP.ev[el.dataset.ev]=el.value}
  if(el.dataset.feel&&el.dataset.id){feelDraft(el.dataset.id)[el.dataset.feel]=el.value}
  if(el.dataset.paste){APP.paste[el.dataset.paste]=el.value}
  if(el.dataset.cfg){APP.cfgDraft=APP.cfgDraft||{};APP.cfgDraft[el.dataset.cfg]=el.value}
  if(el.dataset.dep&&APP.depForm){APP.depForm[el.dataset.dep]=el.value}
  if(el.dataset.cm!=null&&APP.cmEdit){APP.cmEdit[+el.dataset.cm]=el.value}
  if(el.dataset.g){const f=gateForm();f[el.dataset.g]=el.type==='checkbox'?el.checked:el.value}
  if(el.dataset.w&&APP.wiz)APP.wiz[el.dataset.w]=el.value;
  if(el.dataset.wq){const k=APP.weekKey||weekKey(now());APP.W[k].answers[el.dataset.wq]=el.value}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.actChange==='kind'&&APP.draft){APP.draft.shots[+el.dataset.i].kind=el.value}
  if(el.dataset.actChange==='gkind'&&APP.gate&&APP.gate.shots[+el.dataset.i]){APP.gate.shots[+el.dataset.i].kind=el.value}
  if(el.dataset.d&&APP.draft&&el.tagName==='SELECT'){APP.draft.f[el.dataset.d]=el.value}
  if(el.dataset.g){const f=gateForm();f[el.dataset.g]=el.type==='checkbox'?el.checked:el.value}});
setInterval(()=>{if(APP.route==='today'&&!APP.detail&&document.visibilityState==='visible'&&!document.activeElement.matches('input,textarea,select'))render()},30000);
boot();
})();
</script>
