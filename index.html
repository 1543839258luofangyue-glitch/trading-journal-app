<title>交易日志</title>
<style>
/* 版式：手机优先的单列工作台，底部固定五个分区；红=禁止，绿=放行，琥珀=待办/冷静 */

  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --paper:#141C23; --ink:#E3E8EC; --muted:#93A0AA; --line:#2B3640; --soft:#1E2831;
  --stop:#E5604F; --stop-soft:rgba(229,96,79,.15); --go:#3EBD97; --go-soft:rgba(62,189,151,.14);
  --wait:#E7B44B; --wait-soft:rgba(231,180,75,.14); --steel:#8DB2D0; --steel-soft:rgba(141,178,208,.10); color-scheme:dark}}
:root[data-theme="dark"]{

  --stop:#E5604F; --stop-soft:rgba(229,96,79,.15); --go:#3EBD97; --go-soft:rgba(62,189,151,.14);
  --wait:#E7B44B; --wait-soft:rgba(231,180,75,.14); --steel:#8DB2D0; --steel-soft:rgba(141,178,208,.10); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}

a{color:var(--steel)}

<body>
<div class="app">
  <header class="top"><h1>交易日志</h1><button type="button" class="pill pillbtn" id="storePill" data-act="tab" data-v="setup">正在读取</button></header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="分区"><div class="row" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ================= 基础 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=3600e3,MIN=60e3,DAY=24*H;
const now=()=>Date.now();
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(/[,，\s]/g,''));return isFinite(n)?n:null};
const bj=ms=>{const d=new Date(ms+8*H);const p=x=>String(x).padStart(2,'0');return{h:d.getUTCHours(),day:`${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`,str:`${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`,date:d}};
function weekKey(ms){const d=new Date(ms+8*H);const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const fy=t.getUTCFullYear();const f4=new Date(Date.UTC(fy,0,4));const w=1+Math.round(((t-f4)/DAY-3+((f4.getUTCDay()+6)%7))/7);return `${fy}-W${String(w).padStart(2,'0')}`}
function fmtMoney(v,d=2){if(v==null||!isFinite(v))return '—';const s=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});return (v<0?'−':v>0?'+':'')+s}

/* ---------- 本机存储（IndexedDB；不可用时退回内存） ---------- */
const IDB={db:null,mem:new Map()};
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('trading-journal',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB.db=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}})}
function idbReq(mode,fn){return new Promise(res=>{if(!IDB.db){res(fn(null));return}try{const tx=IDB.db.transaction('kv',mode);const st=tx.objectStore('kv');const r=fn(st);if(r&&'onsuccess' in r){r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)}else{tx.oncomplete=()=>res(r);tx.onerror=()=>res(undefined)}}catch(e){res(undefined)}})}
const idbGet=k=>IDB.db?idbReq('readonly',st=>st.get(k)):Promise.resolve(IDB.mem.get(k));
const idbSet=(k,v)=>IDB.db?idbReq('readwrite',st=>st.put(v,k)):Promise.resolve(IDB.mem.set(k,v));
const idbDel=k=>IDB.db?idbReq('readwrite',st=>st.delete(k)):Promise.resolve(IDB.mem.delete(k));
function idbEntries(prefix){if(!IDB.db)return Promise.resolve([...IDB.mem.entries()].filter(([k])=>k.startsWith(prefix)));
  return new Promise(res=>{const out=[];try{const tx=IDB.db.transaction('kv','readonly');const c=tx.objectStore('kv').openCursor(IDBKeyRange.bound(prefix,prefix+'￿'));c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}else res(out)};c.onerror=()=>res(out)}catch(e){res(out)}})}

/* ---------- 保存：先存本机，再排队上传 ---------- */
async function putDoc(path,data){const c=(await idbGet('doc:'+path))||{};c.data=clone(data);await idbSet('doc:'+path,c);enqueue({op:'json',path})}
function saveP(){return putDoc(PATH.P,APP.P)}
function saveT(t){t.updatedAt=now();return putDoc(PATH.T(t.id),t)}
function delT(t){APP.T=APP.T.filter(x=>x.id!==t.id);idbDel('doc:'+PATH.T(t.id));enqueue({op:'del',path:PATH.T(t.id)});(t.shots||[]).forEach(s=>{if(s.p){idbDel('img:'+s.p);enqueue({op:'del',path:s.p})}})}
function saveW(k){APP.W[k].k=k;APP.W[k].updatedAt=now();return putDoc(PATH.W(k),APP.W[k])}
function saveF(f){return putDoc(PATH.F(f.id),f)}
function saveD(k){APP.D[k].k=k;APP.D[k].updatedAt=now();return putDoc(PATH.D(k),APP.D[k])}
function enqueue(op){const q=SYNC.q;if(op.op==='json'&&q.some(o=>o.op==='json'&&o.path===op.path))return;
  if(op.op==='del'){SYNC.q=q.filter(o=>o.path!==op.path)}SYNC.q.push(Object.assign({ts:now()},op));idbSet('queue',SYNC.q);updatePill();clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,800)}

/* ---------- GitHub ---------- */
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const repoPath=()=>`/repos/${encodeURIComponent(CFG.owner)}/${encodeURIComponent(CFG.repo)}`;
const contentsURL=p=>`${repoPath()}/contents/${enc(p)}`;
async function gh(method,path,body,accept,cfg){const c=cfg||CFG;let r;
  try{r=await fetch(c.api+path,{method,cache:'no-store',headers:Object.assign({Authorization:'Bearer '+c.token,Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined})}
  catch(e){const er=new Error('net');er.kind='net';throw er}
  return r}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}const er=new Error(m||('HTTP '+r.status));er.status=r.status;
  er.kind=r.status===401?'auth':r.status===403&&/rate limit/i.test(m)?'rate':r.status===403?'perm':r.status===404?'notfound':'http';return er}
function b64bytes(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const b64json=o=>b64bytes(new TextEncoder().encode(JSON.stringify(o,null,1)+'\n'));
const b64blob=async b=>b64bytes(new Uint8Array(await b.arrayBuffer()));
const unb64json=s=>{const bin=atob(String(s).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))};
function msgFor(path,data){const rel=path.slice(REC.length+1);
  if(rel==='profile.json')return '日志：更新状态';if(rel.startsWith('trades/'))return `日志：记录 #${(data&&data.no)||''}`.trim();
  if(rel.startsWith('days/'))return '日志：心情 '+rel.slice(5,-5);if(rel.startsWith('weeks/'))return '日志：周复盘 '+rel.slice(6,-5);if(rel.startsWith('screenshots/'))return '日志：截图';if(rel.startsWith('exports/'))return '日志：交易所导出';return '日志：'+rel}
async function getRemoteJSON(path){const r=await gh('GET',contentsURL(path)+'?ref='+encodeURIComponent(CFG.branch));if(r.status===404)return null;if(!r.ok)throw await ghErr(r);const j=await r.json();return {sha:j.sha,data:unb64json(j.content||'')}}
function mergeProfile(remote,local){const m=Object.assign({},remote,local);const uniq=(a,key)=>{const s=new Map();a.forEach(x=>s.set(key(x),x));return [...s.values()]};
  m.voided=uniq([...(remote.voided||[]),...(local.voided||[])],x=>x.key);const vd=new Set(m.voided.map(x=>x.key));
  m.violations=uniq([...(remote.violations||[]),...(local.violations||[])],v=>v.t+'|'+v.rule+'|'+v.trade).filter(v=>!vd.has(vKey(v))).sort((a,b)=>a.t-b.t).slice(-300);
  m.deposits=uniq([...(remote.deposits||[]),...(local.deposits||[])],d=>d.t).sort((a,b)=>a.t-b.t).slice(-100);
  ['seq','paperPlans','lastLossAt','lastBigWinAt','externalSeenAt','weekStopUntil','depositLockUntil','lockUntil'].forEach(k=>m[k]=Math.max(remote[k]||0,local[k]||0));if(m.lockUntil&&m.lockUntil===(remote.lockUntil||0)&&remote.lockReason)m.lockReason=remote.lockReason;if(vd.size){const lk=lockFrom(m.violations);m.lockUntil=lk.until;m.lockReason=lk.reason}{const ps=[remote.practiceStart,local.practiceStart].filter(x=>x>0);m.practiceStart=ps.length?Math.min(...ps):0}
  if(remote.lastClose&&(!local.lastClose||remote.lastClose.t>local.lastClose.t))m.lastClose=remote.lastClose;return m}
function mergeDoc(path,remote,local){if(path===PATH.P)return mergeProfile(remote||{},local||{});if(path.startsWith(REC+'/days/')&&remote&&local){const mm=new Map();[...(remote.entries||[]),...(local.entries||[])].forEach(e=>mm.set(e.t,e));return Object.assign({},remote,local,{entries:[...mm.values()].sort((a,b)=>a.t-b.t)})}return (remote&&(remote.updatedAt||0)>(local.updatedAt||0))?remote:local}
async function pushJSON(path,c){const body={message:msgFor(path,c.data),content:b64json(c.data),branch:CFG.branch};if(c.sha)body.sha=c.sha;
  let r=await gh('PUT',contentsURL(path),body);
  if(r.status===409||r.status===422){/* 另一台设备改过，或文件已存在：取回来合并后再存 */
    const remote=await getRemoteJSON(path);if(remote){c.data=mergeDoc(path,remote.data,c.data);body.sha=remote.sha;body.content=b64json(c.data)}else delete body.sha;
    r=await gh('PUT',contentsURL(path),body);APP.needReload=true}
  if(!r.ok)throw await ghErr(r);const j=await r.json();c.sha=j.content&&j.content.sha;await idbSet('doc:'+path,c)}
async function doOp(op){
  if(op.op==='json'){const c=await idbGet('doc:'+op.path);if(c&&c.data)await pushJSON(op.path,c);return}
  if(op.op==='blob'){const b=(await idbGet('img:'+op.path))||(await idbGet('file:'+op.path));if(!b)return;
    const r=await gh('PUT',contentsURL(op.path),{message:msgFor(op.path),content:await b64blob(b),branch:CFG.branch});if(r.status===422)return;if(!r.ok)throw await ghErr(r);return}
  if(op.op==='del'){let sha=null;const r0=await gh('GET',contentsURL(op.path)+'?ref='+encodeURIComponent(CFG.branch));if(r0.status===404)return;if(!r0.ok)throw await ghErr(r0);sha=(await r0.json()).sha;
    const r=await gh('DELETE',contentsURL(op.path),{message:'日志：删除记录',sha,branch:CFG.branch});if(r.status===404)return;if(!r.ok)throw await ghErr(r)}}
async function ensureBranch(){if(CFG.branch)return;const r=await gh('GET',repoPath());if(!r.ok)throw await ghErr(r);CFG.branch=(await r.json()).default_branch||'main';lsSet('tj_gh',CFG)}
async function flush(){if(SYNC.busy||!cfgOk()||!SYNC.q.length){updatePill();return}SYNC.busy=true;updatePill();
  try{await ensureBranch();while(SYNC.q.length){const op=SYNC.q[0];await doOp(op);SYNC.q=SYNC.q.filter(o=>o!==op);await idbSet('queue',SYNC.q);updatePill()}
    SYNC.err=null;SYNC.last=now();lsSet('tj_last_sync',SYNC.last)}
  catch(e){SYNC.err=e}
  SYNC.busy=false;updatePill();if(APP.needReload){APP.needReload=false;await loadFromCache();render()}}
/* 从 GitHub 取回别的设备记下的内容 */
async function pull(){if(!cfgOk())return false;let changed=false;
  try{await ensureBranch();const r1=await gh('GET',`${repoPath()}/git/trees/${encodeURIComponent(CFG.branch)}`);if(r1.status===409||r1.status===404)return false;if(!r1.ok)throw await ghErr(r1);
    const rec=((await r1.json()).tree||[]).find(x=>x.path===REC&&x.type==='tree');const remote={};
    if(rec){const r2=await gh('GET',`${repoPath()}/git/trees/${rec.sha}?recursive=1`);if(!r2.ok)throw await ghErr(r2);
      ((await r2.json()).tree||[]).forEach(x=>{if(x.type==='blob'&&/^(profile\.json|(trades|weeks|files|days)\/[^/]+\.json)$/.test(x.path))remote[REC+'/'+x.path]=x.sha})}
    const pend=new Set(SYNC.q.map(o=>o.path));
    for(const [path,sha] of Object.entries(remote)){if(pend.has(path))continue;const c=await idbGet('doc:'+path);if(c&&c.sha===sha)continue;
      const r=await gh('GET',`${repoPath()}/git/blobs/${sha}`);if(!r.ok)throw await ghErr(r);await idbSet('doc:'+path,{sha,data:unb64json((await r.json()).content)});changed=true}
    for(const [k,c] of await idbEntries('doc:'+REC+'/')){const path=k.slice(4);if(!remote[path]&&!pend.has(path)&&c&&c.sha){await idbDel(k);changed=true}}
    SYNC.err=null;SYNC.last=now();lsSet('tj_last_sync',SYNC.last)}
  catch(e){SYNC.err=e}
  if(changed)await loadFromCache();updatePill();return changed}
async function loadFromCache(){const T=[],W={},F=[],D={};let P=null;
  for(const [k,v] of await idbEntries('doc:'+REC+'/')){if(!v||!v.data)continue;const p=k.slice(4);
    if(p===PATH.P)P=v.data;else if(p.startsWith(REC+'/trades/'))T.push(v.data);else if(p.startsWith(REC+'/weeks/'))W[v.data.k||p.split('/').pop().replace(/\.json$/,'')]=v.data;else if(p.startsWith(REC+'/files/'))F.push(v.data);else if(p.startsWith(REC+'/days/'))D[v.data.k||p.split('/').pop().replace(/\.json$/,'')]=v.data}
  APP.P=Object.assign(freshProfile(),P||{});if(cleanVoided(APP.P))setTimeout(()=>saveP(),0);APP.T=T.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));APP.W=W;APP.D=D;APP.F=F.sort((a,b)=>(b.t||0)-(a.t||0))}
const nextNo=()=>Math.max(APP.P.seq||0,...APP.T.map(t=>t.no||0))+1;

const IMGURL={};
async function getBlob(p){let b=(await idbGet('img:'+p))||(await idbGet('file:'+p));
  if(!b&&cfgOk()){try{await ensureBranch();const r=await gh('GET',contentsURL(p)+'?ref='+encodeURIComponent(CFG.branch),null,'application/vnd.github.raw');if(r.ok){b=await r.blob();await idbSet((/\.csv$/i.test(p)?'file:':'img:')+p,b)}}catch(e){}}
  return b||null}
async function imgURL(p){if(IMGURL[p])return IMGURL[p];const b=await getBlob(p);if(!b)return null;return IMGURL[p]=URL.createObjectURL(b)}
function hydrate(){document.querySelectorAll('img[data-img]:not([src])').forEach(async el=>{const u=await imgURL(el.dataset.img);if(u)el.src=u;else{el.alt='截图还没取到';el.classList.add('noimg')}})}
function saveFile(name,data,type){const blob=data instanceof Blob?data:new Blob([data],{type:type||'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},5000)}

/* ---------- 状态标签 ---------- */
function updatePill(){const pill=$('#storePill');if(!pill)return;const n=SYNC.q.length;let t,c;
  if(APP.mode==='loading'){t='正在读取';c='pill'}
  else if(!cfgOk()){t='没连 GitHub：只存在这台设备';c='pill bad'}
  else if(SYNC.busy){t=n?`正在上传 ${n} 项`:'正在同步';c='pill warn'}
  else if(SYNC.err){const k=SYNC.err.kind;t=k==='net'?`没网，${n} 项待上传`:k==='auth'?'钥匙失效，点这里重新连接':k==='perm'?'钥匙没有写入权限':k==='notfound'?'找不到仓库，点这里检查':`上传出错，${n} 项待上传`;c='pill bad'}
  else if(n){t=`${n} 项待上传`;c='pill warn'}

function overnight(t){if(!t.open||!t.close)return false;let a=t.open.t,b=t.close.t;let d=new Date(a+8*H);d=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-8*H;for(;d<=b;d+=DAY){if(a<d+7*H&&b>d)return true}return false}

async function shrink(file){

    if(window.createImageBitmap){src=await createImageBitmap(file);w=src.width;h=src.height}
    else{src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}
    const k=Math.min(1,1600/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.85));
  }catch(e){return file}
}

    ${t.plan&&t.plan.gate==='pass'?`<div class="yn"><span>入场是按计划的价位和理由吗</span>${yn('wset','followEntry',w.followEntry)}</div>`:`<p class="small muted">这笔没做下单前检查，没有计划可对照，“按计划执行”一项直接算没做到。</p>`}${nav(s)}</section>`}
  if(s===1){const beQ=w.smoves.includes('be')||w.smoves.includes('smallWin');
    body=`<section class="card"><h2>出场和止损</h2>
    <div class="f"><span>最后怎么平的：<b>${esc(exitText(exitKey(t)))}</b>。为什么在这时候平？</span>${single('wpick1',EXITWHY,w.exitWhy)}</div>

  if(s===2){body=`<section class="card"><h2>浮亏时和持仓中</h2>

    ${w.floatMax&&w.floatMax!=='0'?`<div class="f">浮亏时你主要怎么做的？（可多选）${multi('wfa',FLOATACT,w.floatActs,k=>['waitStop','resisted'].includes(k)?'y':'n')}</div>`:''}
    <div class="f">持仓时还有没有这些？（可多选）${multi('who',HOLDOTHER,w.holdOther,k=>k==='none'?'y':'n')}</div>${nav(s)}</section>`}
  if(s===3){body=`<section class="card"><h2>平仓后和当时的感觉</h2>
    <div class="f">平仓后行情怎么走的？${single('wam',AFTERMOVE,w.afterMove)}</div>
    <div class="f">平仓后脑子里出现过这些念头吗？（可多选）${multi('wat',AFTERTHINK,w.afterThink||[],k=>k==='none'?'y':'n')}</div>
    <div class="f">平仓后你做了哪些？（可多选）${multi('wac',AFTERCLOSE.filter(x=>x[0]!=='counterfactual'||w.afterClose.includes('counterfactual')),w.afterClose,k=>k==='none'?'y':'n')}</div>
    ${w.afterMove==='kept'&&!(w.afterThink||[]).length?`<p class="small wait">行情接着往你的方向走时，最容易算“少赚了多少”。照实点，点了不扣分。</p>`:''}
    ${[['before','开仓前'],['during','持仓中'],['after','平仓后']].map(p=>`<div class="f">${p[1]}的感觉<div class="seg">${EMO.map(e=>`<button type="button" data-act="we" data-p="${p[0]}" data-v="${e}" aria-pressed="${w.emo[p[0]].includes(e)}">${e}</button>`).join('')}</div></div>`).join('')}<div class="f">情绪有多强（1 很平静，5 很强烈）<div class="seg">${[1,2,3,4,5].map(n=>`<button type="button" data-act="wl" data-v="${n}" aria-pressed="${w.emo.level===n}">${n}</button>`).join('')}</div></div>${nav(s)}</section>`}
  if(s===4){const g=gradeOf(t,w);const G=GRADE[g.key];const cl=classify(Object.assign({},t,{checks:g.checks,review:Object.assign({},t.review||{},{smoves:w.smoves,floatActs:w.floatActs,floatMax:w.floatMax,stopHit:w.stopHit,beReached:w.beReached,exitWhy:w.exitWhy})}),g.key);
    body=`<section class="card"><h2>这一笔是：${G[0]}</h2>${grid3(g.key)}<p>${G[1]}</p>${g.good?'':`<p class="small muted">判成“犯了错”的原因：${whyBad(t,w).map(esc).join('；')}。</p>`}</section>
    <section class="card"><h3>按你原来复盘表的分类</h3><p class="small muted">由上面的回答自动推出，只用来认出旧模式（保本出场、扛单、错误盈利等）。</p><dl class="kv"><dt>出场方式</dt><dd>${esc(cl.出场方式)}</dd><dt>止损类型</dt><dd>${esc(cl.止损类型)}</dd><dt>扛单类型</dt><dd>${esc(cl.扛单类型)}</dd><dt>交易类型</dt><dd>${esc(cl.交易类型)}</dd></dl>${nav(s)}</section>`}
  if(s===5){const hints=lessonHints(t,w);const cm=(APP.P.commitments||[]).map((c,i)=>[String(i),c&&c.text]).filter(x=>x[1]);

function grid3(key){const on=k=>key===k?'on':'';return `<div class="grid3"><div class="h"></div><div class="h">赚了</div><div class="h">保本</div><div class="h">亏了</div><div class="h">守规则</div><div class="gw ${on('Gwin')}">正确盈利</div><div class="gb ${on('Gbe')}">正确保本</div><div class="gl ${on('Gloss')}">正确亏损<br><span class="small">好交易</span></div><div class="h">犯了错</div><div class="bw ${on('Bwin')}">错误盈利<br><span class="small">最危险</span></div><div class="bb ${on('Bbe')}">错误保本</div><div class="bl ${on('Bloss')}">错误亏损</div></div>`}
const nav=s=>`<div class="btns full"><button type="button" class="btn sec" data-act="wizPrev" ${s===0?'disabled':''}>上一步</button><button type="button" class="btn" data-act="wizNext">下一步</button></div>`;
function wizMissing(w){const s=w.step;if(s===0&&!w.real.length)return '请点选开这单真正的原因';
  if(s===1&&!w.exitWhy)return '请选“为什么在这时候平”';if(s===1&&!w.smoves.length)return '请选“止损怎么动过”';if(s===1&&!w.stopHit)return '请选“价格到过计划止损价吗”';
  if(s===2&&!w.floatMax)return '请选“最多浮亏到几倍”';if(s===2&&!w.holdOther.length)return '请选“持仓时还有没有这些”（没有就点“都没有”）';
  if(s===3&&!w.afterClose.length)return '请选“平仓后你做了哪些”（没有就点“都没有”）';return null}
function whyBad(t,w){const r=[];const c=wizChecks(t,w);tradeHL(Object.assign({},t,{checks:c})).forEach(n=>r.push('破了硬线 '+n+'（'+hlText(n)+'）'));
  if(!(t.plan&&t.plan.gate==='pass'))r.push('开单前没做下单前检查');else if(w.followEntry!==true)r.push('入场没按计划');
  if(w.exitWhy&&w.exitWhy!=='plan')r.push('出场不是按计划：'+(EXITWHY.find(x=>x[0]===w.exitWhy)||['',''])[1]);return r}
function wizDone(){const w=APP.wiz,t=APP.T.find(x=>x.id===w.id);if(!t)return;try{localStorage.removeItem('tj_wiz_'+w.id)}catch(e){}const g=gradeOf(t,w);const P=APP.P;
  t.checks=g.checks;t.emotion=clone(w.emo);
  t.review=Object.assign(t.review||{},{v:2,exec:{followEntry:w.followEntry,stopAtOpen:t.open?t.open.stopAtOpen:null,sizeOk:sizeOk(t),followExit:w.exitWhy==='plan'},realTriggers:w.real.slice(),exitWhy:w.exitWhy,smoves:w.smoves.slice(),beReached:w.beReached,stopHit:w.stopHit,floatMax:w.floatMax,floatActs:w.floatActs.slice(),holdOther:w.holdOther.slice(),afterClose:w.afterClose.slice(),afterThink:(w.afterThink||[]).slice(),afterMove:w.afterMove||null,commitBroken:w.commitBroken.slice(),

n&&t.plan.kk?`<dt>KK 清单</dt><dd>${(()=>{const fs=t.plan.kk.fails||[];const real=fs.filter(x=>!/没选完/.test(x));const miss=fs.filter(x=>/没选完/.test(x)).map(x=>x.replace(/^.*没选完：/,''));return (real.length?`<span class="stop">不合格</span>：${esc(real.join('；'))}`:'<span class="go">选了的都合格</span>')+(miss.length?` <span class="muted">· 没填：${esc(miss.join('、'))}（选填）</span>`:'')})()}${t.plan.rr!=null?` · 盈亏比 1 : ${t.plan.rr}`:''}</dd>`:''}${t.review&&t.review.lesson?`<dt>教训</dt><dd>${esc(t.review.lesson)}</dd>`:''}${t.review&&t.review.next?`<dt>下一笔动作</dt><dd>${esc(t.review.next)}</dd>`:''}${t.note?`<dt>备注</dt><dd>${esc(t.note)}</dd>`:''}</dl>

function mdToHtml(md){const L=String(md||'').split('\n');let h='',inUl=false,tbl=null;const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const closeAll=()=>{if(inUl){h+='</ul>';inUl=false}if(tbl){h+='<table>'+tbl.map((r,i)=>'<tr>'+r.map(c=>i===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>';tbl=null}};
  L.forEach(l=>{const t=l.trim();
    if(/^\|.*\|$/.test(t)){if(inUl){h+='</ul>';inUl=false}if(/^\|[\s:|-]+\|$/.test(t))return;tbl=tbl||[];tbl.push(t.slice(1,-1).split('|').map(c=>c.trim()));return}
    if(tbl){h+='<table>'+tbl.map((r,i)=>'<tr>'+r.map(c=>i===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>';tbl=null}
    if(/^#{1,2} /.test(t)){closeAll();h+=`<h3>${inl(t.replace(/^#+ /,''))}</h3>`}else if(/^#{3,} /.test(t)){closeAll();h+=`<h4>${inl(t.replace(/^#+ /,''))}</h4>`}
    else if(/^- /.test(t)){if(!inUl){h+='<ul>';inUl=true}h+=`<li>${inl(t.slice(2))}</li>`}
    else if(t){closeAll();h+=`<p>${inl(t)}</p>`}else closeAll()});
  closeAll();return h}

- \`复盘记录.md\`：人能直接读的逐笔复盘。
- \`data/trades.json\` / \`data/trades.jsonl\`：逐笔原始数据（每行一笔），附 \`computed\`（净盈亏、R、是否跨凌晨、持仓分钟、是否全部守规则等）。
- \`data/profile.json\`：练习状态（riskU 每笔最多亏多少 u、practiceStart 练习开始时间、cleanCount 连续守住 6 条硬线的笔数、lockUntil 停到什么时候）、违规记录 violations（hl 是破的第几条硬线，pre = 练习开始前的单）。
- \`data/days.json\`：每天的心情记录。
- \`data/weeks.json\`：周复盘回答。
- \`data/metrics.json\`：全部 / 最近 30 天 / 按周的守规则比例和结果，和 136 笔基线 baseline136 对比。
- \`data/exchange_exports.json\` + \`exports/\`：用户上传的交易所导出（CSV），用于对账。
- \`screenshots/T编号/\`：交易所仓位截图和 K 线图。

## 关键字段
- 时间都是毫秒时间戳（UTC）；\`computed.openBJ\` / \`closeBJ\` 是北京时间。
- \`status\`：open 持仓中 / closed 待复盘 / reviewed 已复盘 / paper 纸面计划（不是真单）。
- \`plan.gate\`：pass 做了下单前检查且绿灯 / skipped 没做检查直接下单 / paper 只写计划没下单。
- \`plan.kk\`：结构依据（KK 清单）的点选结果。dir 日线方向 UP/DOWN/RANGE；tf 形态画在哪个级别 1d/12h/4h/low；pat 形态 range 水平区间 / rtri 直角三角 / stri 对称三角 / flag 旗形 / mw M顶W底 / hs 头肩 / hard 难形态 / none 看不出；touch 碰了几次 2/3/4/5（5 = 5 次以上）；pts、flat、norev、wickOk、noNews 是否满足（true = 满足）；fail 这条线以前失败几次 0/1/2；conf 突破确认 4h/12h/1d/intra（还没收线）/no（还没突破）；vol up/flat/low；stopAt candle（突破那根 K 线外）/other；tgtBy measure/pole/other；ok 是否全部合格，fails 不合格的原因。\`plan.rr\`：目标倍数（目标距离 ÷ 止损距离）。\`plan.note\`：补充说明。截图 kind 为 preDay / preTf 的是下单前的 K 线图。
- \`plan.isPlan\`：依据是不是自己提前写好的结构计划；\`plan.triggers\`：开仓那一刻的情况（多选）：missed 刚错过/刚被打掉、regret 想回本、revisit 价格回到上一单位置、ext 刚看了直播群新闻、askGroup 刚去群里问、bored 无聊、toy 小仓玩一下或晒单、number 想让账户回到某个数。旧记录只有单选 \`plan.trigger\`。
- \`plan.ifLosing\`（浮亏时打算：letStop/add/later）、\`plan.bePolicy\`（after1R/immediate）、\`plan.intendedQty\` 与 \`plan.intendRatio\`（本来想开的数量 ÷ 允许数量，衡量重仓冲动）。
- \`urges\`：持仓中点“我想……”按钮的记录（忍住的冲动）。
- \`feels\`：持仓中随时记下的感受：t 时间、emo 情绪（calm 平静、confident 有把握、nervous 紧张、fear 害怕、hope 侥幸希望它回来、regret 后悔、anxious 着急、greedy 贪心、excited 兴奋、angry 烦躁、revenge 想回本、bored 无聊、numb 麻木）、pnl 当时浮盈 profit / 成本附近 be / 浮亏 loss、doing 当时在做什么（watch 盯盘、lowtf 看 1 小时以下的图、ext 看直播或群、video 刷视频、out 吃饭外出、work 上班、drink 喝了酒、bed 准备睡觉、night 半夜醒着）、price、text 自己写或说的话。和 events、urges 按时间放在一起看，能看出哪种情绪之后出现了什么动作。
- \`review\`：realTriggers 事后看真实原因；exitWhy 为什么这时候平；smoves 止损怎么动过；beReached 挪保本时浮盈是否到 1R；stopHit 价格到过止损但没走（yesStay）；floatMax 最多浮亏几倍计划亏损；floatActs 浮亏时怎么做；holdOther 持仓中的其他情况；afterClose 平仓后做了什么。
- \`classification\`：按用户原复盘表口径自动推出的 出场方式 / 止损类型 / 扛单类型 / 交易类型（rule_version manual136-v1），可直接和 136 笔基线比。
- \`recon\`（如有）：用交易所导出对账后写入的结果，优先于自报。
- \`plan.stop0\` 开仓时止损，\`plan.stop\` 最后的止损；\`open.price0\`/\`qty0\` 首仓，\`open.price\`/\`qty\` 加减仓后的均价和数量。
- \`events\`：持仓中当场记下的动作（add 加仓 / reduce 减仓 / stop 改止损，dir=tighten 收紧、widen 往外挪 / cancelStop 撤止损 / transfer 转钱入金），\`flag\` 是页面自动判定的违规。
- \`checks\`（true = 做过）：addLoss 浮亏加仓、addEarly 浮盈不到 1R 加仓、moveStop 止损放宽过（任何放宽）、stopBeyond 挪到第一张止损外面（与基线口径一致）、cancelStop 撤止损、transfer 持仓转钱、second 同时两个仓、badState 状态不对时交易、stopHeld 到了止损没走、feeHold 因手续费到了止损没走、feeLimit 因手续费到了出场位还挂限价等、extChanged 持仓中被直播群影响改单、levSetting 杠杆超 3 倍或全仓、beEarly 不到 1R 挪保本。
- \`close.pnl\` 照抄交易所的盈亏；\`close.fee\` 手续费；\`close.feeIncl\` = yes 盈亏已扣费 / no 没扣 / unk 不清楚。
- \`review.grade\`：Gwin 正确盈利 / Gloss 正确亏损 / Gbe 正确保本 / Bwin 错误盈利 / Bloss 错误亏损 / Bbe 错误保本（G=守规则，B=犯了错）。

## 监督时请看
1. 6 条硬线守没守住（computed.allRulesPassed 指 6 条硬线）；入金次数必须是 0。结果只看 R，不谈赚了多少 u、能还多少钱。
2. 有没有重复旧模式：浮亏加仓、止损往外挪或撤掉、持仓中转钱、亏损后马上再开、大赚后马上再开、看了直播群消息开单、半夜或喝酒后交易。
3. 自报数据可能漏记，有交易所导出时请逐笔对账。
4. 只评价过程和纪律，不预测行情，不给买卖建议。

  if(el.dataset.self&&APP.selfForm){APP.selfForm[el.dataset.self]=el.value}
  if(el.dataset.cm!=null&&APP.cmEdit){APP.cmEdit[+el.dataset.cm]=el.value}
  if(el.dataset.g){const f=gateForm();f[el.dataset.g]=el.type==='checkbox'?el.checked:el.value;if(['entry','stop','target','side'].includes(el.dataset.g))rrLiveEl()}
  if(el.dataset.w&&APP.wiz){APP.wiz[el.dataset.w]=el.value;lsSet('tj_wiz_'+APP.wiz.id,APP.wiz)}
  if(el.dataset.wq){const k=APP.weekKey||weekKey(now());APP.W[k].answers[el.dataset.wq]=el.value}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.actChange==='kind'&&APP.draft){APP.draft.shots[+el.dataset.i].kind=el.value}
  if(el.dataset.actChange==='gkind'&&APP.gate&&APP.gate.shots[+el.dataset.i]){APP.gate.shots[+el.dataset.i].kind=el.value}
  if(el.dataset.actChange==='mkind'){const f=moodDraft();if(f.shots&&f.shots[+el.dataset.i])f.shots[+el.dataset.i].kind=el.value}
  if(el.dataset.moodfile){if(el.files&&el.files.length)addMoodFiles(el.files);el.value=''}
  if(el.dataset.actChange==='fkind'){const f=feelDraft(el.dataset.id);if(f.shots&&f.shots[+el.dataset.i])f.shots[+el.dataset.i].kind=el.value}
  if(el.dataset.feelfile){if(el.files&&el.files.length)addFeelFiles(el.dataset.feelfile,el.files);el.value=''}
  if(el.dataset.symsel){const f=el.dataset.symsel==='g'?gateForm():(APP.draft&&APP.draft.f);if(f){if(el.value==='OTHER'){f.symOther=true;if(SYMS.includes(f.symbol)||f.symbol==='OTHER')f.symbol=''}else{f.symOther=false;f.symbol=el.value}if(APP.draft&&APP.draft.aiFilled)delete APP.draft.aiFilled.symbol;render()}}
  if(el.dataset.d&&APP.draft&&el.tagName==='SELECT'){APP.draft.f[el.dataset.d]=el.value}
  if(el.dataset.g){const f=gateForm();f[el.dataset.g]=el.type==='checkbox'?el.checked:el.value;if(['entry','stop','target','side'].includes(el.dataset.g))rrLiveEl()}});
setInterval(()=>{if(APP.route==='today'&&!APP.detail&&document.visibilityState==='visible'&&!document.activeElement.matches('input,textarea,select'))render()},30000);
boot();
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
